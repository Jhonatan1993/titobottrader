<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso a alertas Telegram · TitoBotTrader</title>
    <link rel="stylesheet" href="/static/css/telegram_monitor.css">
</head>

<body>
    <main>
        <h1>Alertas por Telegram</h1>
        <p>Inicia sesión con tu cuenta de administrador para configurar el monitor independiente.</p>
        <form method="post" autocomplete="off">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <label for="username">Usuario administrador</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>

</html>
